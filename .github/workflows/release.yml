name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: |
          NAME="claude-statusline-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -czf "$NAME.tar.gz" -C "target/${{ matrix.target }}/release" claude-statusline
      # Windows ships a .zip: the binary carries an .exe suffix, and .zip is
      # the archive Windows extracts without extra tooling.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "claude-statusline-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          Compress-Archive -LiteralPath "target/${{ matrix.target }}/release/claude-statusline.exe" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            claude-statusline-*.tar.gz
            claude-statusline-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Glob every downloaded artifact, not one archive format: a format the
      # matrix adds later must not fall silently out of the checksums.
      - name: Checksums
        run: sha256sum claude-statusline-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            claude-statusline-* SHA256SUMS
