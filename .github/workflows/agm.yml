name: AGM

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provenance gate
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/agm_gate.py
