[package]
name = "claude-statusline"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Fast statusline for Claude Code. Renders from the stdin payload; git runs behind a per-repo cache."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JairoTorregrosa/claude-statusline"
readme = "README.md"
keywords = ["claude-code", "statusline", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
